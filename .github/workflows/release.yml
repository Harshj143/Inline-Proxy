# Release: on a version tag, build the package, generate an SBOM, scan for known
# vulnerabilities, and attach the artifacts to the GitHub release.
#
# A security proxy that ships without a bill of materials is asking its operators
# to trust it blind. Every tagged release therefore carries a CycloneDX SBOM (what
# is in the wheel) and a pip-audit report (whether any of it has a known CVE), so
# a downstream can answer "am I exposed to X?" without unpacking the artifact.
#
# Versioning policy: semantic versioning on `version` in pyproject.toml. Tag
# `vX.Y.Z` to release. A MAJOR bump is a breaking change to the policy schema, the
# audit event schema, the bundle format, or the CLI contract — the interfaces a
# deployment depends on. `schema_version` inside a policy/bundle is independent and
# only bumps when that document's shape changes.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write        # to create the release + upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify the tag matches pyproject version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pyproject version $pkg"
            exit 1
          fi

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Generate CycloneDX SBOM + vulnerability scan
        run: |
          python -m pip install cyclonedx-bom pip-audit
          # SBOM of exactly what the wheel installs (core deps).
          python -m pip install -e .
          cyclonedx-py environment --output-format json --outfile sbom.cyclonedx.json
          # Known-CVE scan; don't fail the release on findings, publish them.
          pip-audit --format json --output pip-audit.json || true

      - name: Publish release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" --generate-notes \
            dist/* sbom.cyclonedx.json pip-audit.json
