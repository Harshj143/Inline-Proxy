# Policy CI — the gate on every change to a shipped policy pack.
#
# Deliberately separate from ci.yml: this is the check a *policy* PR cares
# about, and it should be readable as its own red/green on the PR without
# hunting through a matrix of language tests. It also stays cheap — a core
# install, no extras — which doubles as a standing proof that policy tooling
# does not drag in the server/vault/presidio tiers.
#
# There is no pack list here on purpose. `policy ci` discovers every connector
# pack and standalone policy under the repo, so adding connectors/<new-pack>/
# is covered on the next PR with no workflow edit. See src/mcp_gateway/policy/ci.py.
name: policy-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  packs:
    name: validate + test every policy pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (core only — policy tooling must not need extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Policy CI
        # --github emits ::error annotations on the offending policy file and
        # appends the summary table to the job summary. Non-zero exit fails the
        # PR: a pack that breaks its own goldens must not merge.
        run: mcp-gateway policy ci --root . --github
