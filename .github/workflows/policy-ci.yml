# Policy CI — the gate on every change to a shipped policy pack.
#
# Deliberately separate from ci.yml: this is the check a *policy* PR cares
# about, and it should be readable as its own red/green on the PR without
# hunting through a matrix of language tests. It also stays cheap — a core
# install, no extras — which doubles as a standing proof that policy tooling
# does not drag in the server/vault/presidio tiers.
#
# There is no pack list here on purpose. `policy ci` discovers every connector
# pack and standalone policy under the repo, so adding connectors/<new-pack>/
# is covered on the next PR with no workflow edit. See src/mcp_gateway/policy/ci.py.
name: policy-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  packs:
    name: validate + test every policy pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (core only — policy tooling must not need extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Policy CI
        # --github emits ::error annotations on the offending policy file and
        # appends the summary table to the job summary. Non-zero exit fails the
        # PR: a pack that breaks its own goldens must not merge.
        run: mcp-gateway policy ci --root . --github

  blast-radius:
    # What does this PR actually change? Reading the YAML diff does not answer
    # it — layered merge, glob specificity, and role overlays mean a three-line
    # edit to roles.yaml can move a hundred decisions. `policy diff` compiles
    # both revisions and enumerates them.
    name: blast radius
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # the base revision must be reachable locally
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Materialize the base revision
        run: git worktree add --detach /tmp/policy-base "origin/${{ github.base_ref }}"
      - name: Compute blast radius
        id: diff
        run: |
          mcp-gateway policy diff --base /tmp/policy-base --head . --json > diff.json
          mcp-gateway policy diff --base /tmp/policy-base --head . --markdown > comment.md
          # The job summary is the fallback that always works — a PR from a fork
          # gets a read-only token and cannot comment, and the reviewer there
          # needs the blast radius just as much.
          cat comment.md >> "$GITHUB_STEP_SUMMARY"
          echo "clean=$(jq -r .clean diff.json)" >> "$GITHUB_OUTPUT"
      - name: Post blast-radius comment
        continue-on-error: true   # see above: forks cannot comment; summary stands in
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          CLEAN: ${{ steps.diff.outputs.clean }}
        run: |
          set -euo pipefail
          marker='<!-- mcp-gateway:policy-diff -->'
          # One comment per PR, edited in place. Twelve stale blast-radius
          # comments train reviewers to ignore all of them.
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
                 --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n1)
          if [ -z "$id" ] && [ "$CLEAN" = "true" ]; then
            echo "no policy decision changes and no existing comment — staying quiet"
            exit 0
          fi
          # A previously-alarming comment still gets updated once the branch goes
          # clean, so nobody reviews against a stale warning.
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@comment.md
          fi

  sign-bundles:
    # Merge → versioned, signed bundles: the release half of policy CI/CD. Runs
    # only on main (a bundle is a thing you deploy, not a thing you review), and
    # only when a signing key is configured — the private key lives in repo
    # secrets, never in the tree, and a fork or an unconfigured repo skips this
    # cleanly rather than failing. The gateway verifies these with the PUBLIC
    # half (commit it to the repo; it is not a secret) — see policy/bundle.py.
    name: build + sign policy bundles
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Install with [vault] (signing needs cryptography)"
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[vault]"
      - name: Build + sign a bundle for every pack
        env:
          # A PEM Ed25519 private key. Configure at Settings → Secrets →
          # Actions as POLICY_SIGNING_KEY (generate with `mcp-gateway policy
          # keygen`; commit the .pub.pem, keep the .pem here).
          POLICY_SIGNING_KEY: ${{ secrets.POLICY_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${POLICY_SIGNING_KEY:-}" ]; then
            echo "::notice::POLICY_SIGNING_KEY not configured — skipping bundle signing. Add the secret to publish signed policy bundles on merge."
            exit 0
          fi
          umask 077
          printf '%s' "$POLICY_SIGNING_KEY" > signing.pem
          mkdir -p dist
          # Discover packs the same way policy ci does — a new pack is bundled
          # on the next merge with no workflow edit.
          names=$(mcp-gateway policy ci --root . --json \
                    | python -c 'import sys,json;[print(p["name"]) for p in json.load(sys.stdin)["packs"] if p["kind"]=="connector"]')
          for name in $names; do
            mcp-gateway policy bundle build --connector "$name" \
              --sign-key signing.pem --out "dist/${name}.mcgb.json"
          done
          rm -f signing.pem
          echo "## Signed bundles" >> "$GITHUB_STEP_SUMMARY"
          for f in dist/*.mcgb.json; do
            ver=$(mcp-gateway policy bundle show "$f" --json | python -c 'import sys,json;print(json.load(sys.stdin)["version"])')
            echo "- \`$(basename "$f")\` — $ver" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Upload signed bundles
        if: hashFiles('dist/*.mcgb.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: policy-bundles
          path: dist/*.mcgb.json
