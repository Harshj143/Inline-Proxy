schema_version: 1
name: mock-crm
default_action: block

taint_sources: [web.fetch]
taint_sinks: [http.post, db.execute_sql]
sequence_rules:
  - after: crm.get_customer
    forbid: http.post
    reason: no outbound POST after reading customer PII in the same session

tools:
  crm.get_customer:
    action: redact
    redaction: standard
    reason: customer records contain PII; strip before the model sees them
    roles:
      admin:
        action: allow
        reason: admins are cleared to see raw customer PII
      analyst:
        action: redact
        redaction: standard
        reason: analysts see masked PII only

  search.docs:
    action: allow
    reason: public documentation search

  web.fetch:
    action: allow
    reason: public web fetch; taints the session

  http.post:
    action: allow
    reason: outbound HTTP is allowed only while the session is clean

  db.execute_sql:
    action: rewrite
    reason: read-only analytics access; unbounded queries are capped
    constraints:
      - arg: sql
        must_match: '^\s*SELECT\b'
        flags: i
        reason: only read-only SELECT statements are permitted
    rewrites:
      - arg: sql
        append: " LIMIT 1000"
        unless_match: '\blimit\b'
        flags: i

  logs.tail:
    action: quarantine
    reason: raw logs may contain secrets

  admin.delete_user:
    action: require_approval
    then: allow
    reason: destructive admin action requires human approval
