# Role overlays for the Jira pack — layered AFTER policy.yaml.
#
# Field-level merge: an overlay changes only the fields it names, so a role
# that relaxes an action still inherits the base rule's redaction/reason.
# Least privilege is the default; these are deliberate, narrow grants.
#
#   support-agent — JSM front line: comment/worklog/transition/customer-request
#                   are un-gated (their normal work); issue mutation still gated
#   project-admin — owns the project: every approval-gated write is un-gated
#                   EXCEPT the destructive delete (no role escalates that)
#   bot           — unattended: no human can answer an approval prompt, so every
#                   write is BLOCKED outright rather than left to fail closed
schema_version: 1
name: jira-roles

tools:
  jira_add_comment:
    roles:
      support-agent:
        action: allow
        reason: "JSM front-line work: comment/worklog/transition/customer-request"
      project-admin:
        action: allow
        reason: "project owner performs issue and project writes directly"
      bot:
        action: block
        reason: "unattended bot identity may not change Jira state"
  jira_add_issues_to_sprint:
