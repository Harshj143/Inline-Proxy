# yaml-language-server: $schema=../../policies/policy.schema.json
#
# Default security policy for the Jira MCP server (sooperset/mcp-atlassian).
# DEFAULT-DENY over the full 63-tool Jira surface. See README.md for the threat model.
#   reads            -> redact (Jira issues/comments carry PII and injected text)
#   attachments      -> quarantine (opaque bytes: a .env, a customer CSV, a keystore)
#   writes           -> require_approval (a human signs off)
#   destructive      -> block (permanent deletion)
# Untrusted content reads (issues, JSM customer requests, dev info) taint the
# session; exfil-capable writes (external links, comments, new issues) are then blocked.
schema_version: 1
name: jira
default_action: block

taint_sources: [jira_batch_get_changelogs, jira_download_attachments, jira_get_board_issues, jira_get_issue, jira_get_issue_development_info, jira_get_issue_images, jira_get_issues_development_info, jira_get_project_issues, jira_get_queue_issues, jira_get_request_type_fields, jira_get_request_types, jira_get_sprint_issues, jira_get_worklog, jira_search]
taint_sinks: [jira_add_comment, jira_batch_create_issues, jira_create_customer_request, jira_create_issue, jira_create_remote_issue_link, jira_edit_comment, jira_update_proforma_form_answers]

sequence_rules:
  - after: jira_get_queue_issues
    forbid: jira_create_remote_issue_link
    reason: "no external link right after reading a JSM customer request (exfil guard)"
  - after: jira_get_queue_issues
    forbid: jira_add_comment
    reason: "no comment right after reading a JSM customer request — an injected instruction must not be echoed back to the customer portal"
  - after: jira_download_attachments
    forbid: jira_create_remote_issue_link
    reason: "no external link right after downloading an attachment (exfil guard)"
  - after: jira_get_issue_development_info
    forbid: jira_create_remote_issue_link
    reason: "no external link right after reading commit/branch data (may carry secrets)"

tools:
  # ---- jira_agile ----
  jira_add_issues_to_sprint:
    action: require_approval
    then: allow
    reason: "state-changing Jira write; a human signs off"
  jira_create_sprint:
    action: require_approval
    then: allow
    reason: "state-changing Jira write; a human signs off"
  jira_get_agile_boards:
    action: redact
    redaction: standard
    reason: "Jira content may carry PII/secrets/injected text; scrub on read"
  jira_get_board_issues:
    action: redact
    redaction: standard
    reason: "Jira content may carry PII/secrets/injected text; scrub on read"
  jira_get_sprint_issues:
