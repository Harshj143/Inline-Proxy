    reason: "state-changing Jira write; a human signs off"
  # ---- jira_attachments ----
  jira_download_attachments:
    action: quarantine
    reason: "opaque attachment/image bytes; withheld from the model for review"
  jira_get_issue_images:
    action: quarantine
    reason: "opaque attachment/image bytes; withheld from the model for review"
