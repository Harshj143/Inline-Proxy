# Complete tool inventory for the Slack MCP server.
#
# Source of truth: korotovsky/slack-mcp-server, extracted from the Tool*
# constants + NewTool registrations in pkg/server/server.go — ALL 22 tools,
# nothing omitted. `risk` is this pack's security classification and is what
# policy.yaml acts on:
#   read            — metadata/profile read (redacted: Slack text is untrusted)
#   secret_adjacent — message/file content: strict redaction, or quarantine when opaque
#   write           — changes state (approval-gated)
#   destructive     — irreversible data loss (this server exposes NONE)
#
# Four write/read tools (conversations_add_message, reactions_add/remove,
# attachment_get_data) are env-gated OFF by default upstream; they are
# inventoried anyway so a rule is ready the moment an operator enables them.
# Regenerate with tools/extract_inventory.py after an upstream bump.
tools:
  conversations_history:
    risk: secret_adjacent
    description: "Get messages from the channel (or DM) by channel_id, the last row/column in the response is used as 'cursor' parameter for pagination if not empty"
  conversations_replies:
    risk: secret_adjacent
    description: "Get a thread of messages posted to a conversation by channelID and thread_ts, the last row/column in the response is used as 'cursor' parameter for pagination i"
  conversations_add_message:
    risk: write
    description: "Add a message to a public channel, private channel, or direct message (DM, or IM) conversation by channel_id and thread_ts."
  reactions_add:
    risk: write
    description: "Add an emoji reaction to a message in a public channel, private channel, or direct message (DM, or IM) conversation."
  reactions_remove:
    risk: write
    description: "Remove an emoji reaction from a message in a public channel, private channel, or direct message (DM, or IM) conversation."
  attachment_get_data:
    risk: secret_adjacent
    description: "Download an attachment's content by file ID. Returns file metadata and content (text files as-is, binary files as base64). Maximum file size is 5MB."
  conversations_search_messages:
    risk: secret_adjacent
    description: "Search messages in a public channel, private channel, or direct message (DM, or IM) conversation using filters. All filters are optional, if not provided then s"
  users_search:
    risk: read
    description: "Search for users by name, email, display name, or Slack user ID. If a Slack user ID is provided (e.g. U07VCEPP4N5), the user is looked up directly. Returns user"
  conversations_unreads:
    risk: secret_adjacent
    description: "Get unread messages across all channels. With browser session tokens (xoxc/xoxd), uses a single API call for complete results. With OAuth user tokens (xoxp), sc"
  conversations_mark:
    risk: write
    description: "Mark a channel or DM as read. If no timestamp is provided, marks all messages as read."
  conversations_leave:
    risk: write
    description: "Leave a channel, group conversation, or DM. Cannot leave the #general channel."
  conversations_join:
    risk: write
    description: "Join a public channel. Use channels_list or channels_me to find channel IDs."
  channels_list:
    risk: read
    description: "Get list of channels"
  channels_me:
    risk: read
    description: "List channels you are a member of. Unlike channels_list which returns all workspace channels, this returns only channels you have joined. Useful on large worksp"
  usergroups_list:
    risk: read
    description: "List all user groups (subteams) in the Slack workspace. User groups are mention groups like @engineering or @design that notify all members. Use this to discove"
  usergroups_me:
    risk: write
    description: "Manage your own user group membership. Use action='list' to see which groups you belong to. Use action='join' with a usergroup_id to add yourself to a group (e."
  usergroups_create:
    risk: write
    description: "Create a new user group (mention group) in the Slack workspace. After creation, use usergroups_users_update to add members, or users can join themselves with us"
  usergroups_update:
    risk: write
    description: "Update a user group's metadata: name, handle (@mention), description, or default channels. Does NOT change members - use usergroups_users_update for that. At le"
  usergroups_users_update:
    risk: write
    description: "Replace all members of a user group with a new list. WARNING: This completely replaces the member list - any user not in the 'users' parameter will be removed. "
  saved_list:
    risk: secret_adjacent
    description: "List saved items from Slack's 'Save for Later' panel. Returns items the user has saved, with optional message content. Replaces the deprecated stars.list API. R"
  saved_update:
    risk: write
    description: "Update a saved item: mark as completed, set a due date, or both. Use item_id and ts values from saved_list output. Replaces the deprecated stars.add/stars.remov"
  saved_clear_completed:
    risk: write
    description: "Clear all completed saved items from the 'Save for Later' panel. This is a bulk operation that removes all items with state='completed'."
