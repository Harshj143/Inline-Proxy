# yaml-language-server: $schema=../../policies/policy.schema.json
#
# Default security policy for the Slack MCP server (korotovsky/slack-mcp-server).
# DEFAULT-DENY over the full 22-tool surface. See README.md for the threat model.
#   message/file reads -> strict redact (Slack is where humans paste secrets)
#   opaque file bytes  -> quarantine (no useful partial view)
#   metadata reads     -> redact:standard
#   writes             -> require_approval (a human signs off)
# This server exposes NO destructive tool (no delete/archive); if a future
# version adds one it lands under default-deny automatically.
# Untrusted content reads taint the session; the send path is then blocked.
schema_version: 1
name: slack
default_action: block

taint_sources: [attachment_get_data, conversations_history, conversations_replies, conversations_search_messages, conversations_unreads, saved_list, users_search]
taint_sinks: [conversations_add_message, usergroups_create, usergroups_update]

sequence_rules:
  - after: conversations_history
    forbid: conversations_add_message
    reason: "no send right after reading a channel (read-then-exfil guard)"
  - after: conversations_search_messages
    forbid: conversations_add_message
    reason: "no send right after a workspace-wide search (crosses every channel ACL)"
  - after: attachment_get_data
    forbid: conversations_add_message
    reason: "no send right after downloading a file (exfil guard)"

tools:
  conversations_history:
    action: redact
    redaction: strict
    reason: "Slack messages routinely carry secrets/PII/injected text; strict scrub"
  conversations_replies:
    action: redact
    redaction: strict
    reason: "Slack messages routinely carry secrets/PII/injected text; strict scrub"
  conversations_add_message:
    action: require_approval
    then: allow
    reason: "state-changing Slack write; a human signs off"
  reactions_add:
    action: require_approval
    then: allow
    reason: "state-changing Slack write; a human signs off"
  reactions_remove:
    action: require_approval
    then: allow
    reason: "state-changing Slack write; a human signs off"
  attachment_get_data:
    action: quarantine
    reason: "opaque file bytes (a keystore, a .env, a customer CSV); withheld for review"
  conversations_search_messages:
    action: redact
    redaction: strict
    reason: "Slack messages routinely carry secrets/PII/injected text; strict scrub"
  users_search:
    action: redact
    redaction: standard
    reason: "Slack profile/channel metadata may carry PII; scrub on read"
  conversations_unreads:
    action: redact
    redaction: strict
    reason: "Slack messages routinely carry secrets/PII/injected text; strict scrub"
  conversations_mark:
    action: require_approval
    then: allow
    reason: "state-changing Slack write; a human signs off"
  conversations_leave:
    action: require_approval
    then: allow
    reason: "state-changing Slack write; a human signs off"
  conversations_join:
    action: require_approval
    then: allow
    reason: "state-changing Slack write; a human signs off"
  channels_list:
    action: redact
    redaction: standard
    reason: "Slack profile/channel metadata may carry PII; scrub on read"
  channels_me:
    action: redact
    redaction: standard
    reason: "Slack profile/channel metadata may carry PII; scrub on read"
  usergroups_list:
    action: redact
    redaction: standard
    reason: "Slack profile/channel metadata may carry PII; scrub on read"
  usergroups_me:
    action: require_approval
    then: allow
    reason: "state-changing Slack write; a human signs off"
  usergroups_create:
    action: require_approval
    then: allow
    reason: "state-changing Slack write; a human signs off"
  usergroups_update:
    action: require_approval
    then: allow
    reason: "state-changing Slack write; a human signs off"
  usergroups_users_update:
    action: require_approval
    then: allow
    reason: "state-changing Slack write; a human signs off"
  saved_list:
    action: redact
    redaction: strict
    reason: "Slack messages routinely carry secrets/PII/injected text; strict scrub"
  saved_update:
    action: require_approval
    then: allow
    reason: "state-changing Slack write; a human signs off"
  saved_clear_completed:
    action: require_approval
    then: allow
    reason: "state-changing Slack write; a human signs off"
