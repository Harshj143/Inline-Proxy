# Golden decision tests for the Slack connector.
#
# Run: mcp-gateway policy test \
#        --policy connectors/slack/policy.yaml \
#        --policy connectors/slack/roles.yaml \
#        --tests  connectors/slack/policy_tests.yaml
# Also enforced in CI via tests/unit/test_slack_pack.py (every tool has an
# explicit rule) and tests/unit/test_slack_sequence.py (the taint/sequence
# controls the golden harness cannot reach).
#
# One representative case per risk class and per role decision. Taint/sequence
# are session-state controls, invisible to this static harness.
tests:
  # ------------------------------------------------ message/file content
  - name: channel history is strict-redacted (and taints the session)
    tool: conversations_history
    arguments: { channel_id: C123 }
    expect:
      outcome: allow
      action: redact
      disposition: redact
      reason_contains: strict scrub

  - name: thread replies are strict-redacted
    tool: conversations_replies
    arguments: { channel_id: C123, thread_ts: "1.2" }
    expect:
      outcome: allow
      action: redact

  - name: workspace-wide message search is strict-redacted
    tool: conversations_search_messages
    arguments: { query: password }
    expect:
      outcome: allow
      action: redact

  - name: saved items are strict-redacted (they hold message content)
    tool: saved_list
    arguments: {}
    expect:
      outcome: allow
      action: redact

  - name: an attachment download is quarantined (opaque bytes)
    tool: attachment_get_data
    arguments: { file_id: F123 }
    expect:
      outcome: allow
      action: quarantine
      disposition: quarantine
      reason_contains: opaque

  # ------------------------------------------------------- metadata reads
  - name: user search is redacted (PII, and a taint source at runtime)
    tool: users_search
    arguments: { query: alice }
    expect:
      outcome: allow
      action: redact
      disposition: redact

  - name: channel list is redacted (recon metadata)
    tool: channels_list
    arguments: {}
    expect:
      outcome: allow
      action: redact

  # --------------------------------------------------------------- writes
  - name: sending a message needs a human (the primary exfiltration sink)
    tool: conversations_add_message
    arguments: { channel_id: C123, payload: hi }
    expect:
      outcome: deny            # fail-closed until an approver is wired
      action: require_approval
      reason_contains: approval

  - name: creating a user group needs a human
    tool: usergroups_create
    arguments: { name: eng, handle: eng }
    expect:
      outcome: deny
      action: require_approval

  - name: replacing a user group's members needs a human
    tool: usergroups_users_update
    arguments: { usergroup: S1, users: [U1, U2] }
    expect:
      outcome: deny
      action: require_approval

  - name: clearing saved items needs a human (bulk write)
    tool: saved_clear_completed
    arguments: {}
    expect:
      outcome: deny
      action: require_approval

  # -------------------------------------------------------------- default
  - name: a tool with no rule meets default deny
    tool: some_future_slack_tool
    expect:
      outcome: deny
      action: block
      reason_contains: default policy

  # ---------------------------------------------------------------- roles
  - name: support-agent may send messages (their normal work)
    tool: conversations_add_message
    role: support-agent
    arguments: { channel_id: C123, payload: "on it" }
    expect:
      outcome: allow
      action: allow
      reason_contains: normal work

  - name: support-agent may add a reaction
    tool: reactions_add
    role: support-agent
    arguments: { channel_id: C123, timestamp: "1.2", name: eyes }
    expect:
      outcome: allow
      action: allow

  - name: support-agent still cannot administer user groups
    tool: usergroups_create
    role: support-agent
    arguments: { name: eng, handle: eng }
    expect:
      outcome: deny
      action: require_approval

  - name: workspace-admin may administer user groups
    tool: usergroups_create
    role: workspace-admin
    arguments: { name: eng, handle: eng }
    expect:
      outcome: allow
      action: allow
      reason_contains: workspace admin

  - name: bot identity cannot write at all (no human to approve)
    tool: conversations_add_message
    role: bot
    arguments: { channel_id: C123, payload: auto }
    expect:
      outcome: deny
      action: block
      reason_contains: unattended bot

  - name: bot may still read (strict-redacted)
    tool: conversations_history
    role: bot
    arguments: { channel_id: C123 }
    expect:
      outcome: allow
      action: redact
