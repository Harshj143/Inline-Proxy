# yaml-language-server: $schema=../../policies/policy.schema.json
#
# EXAMPLE company override layer for the Slack connector.
#
# Customize the pack with a layer like this — never by forking it:
#
#   mcp-gateway wrap --connector slack --override my-company.yaml -- <server cmd>
#
# Layers merge field-by-field, later wins (docs/ARCHITECTURE.md §5). Naming a
# field replaces just that field; everything else in the shipped rule survives.
# That is deliberately fail-safe: loosening an action does not silently discard
# the constraints attached to it. Use `replace: true` on a rule when you really
# do mean "discard the lower layers for this tool".
#
# Nothing here is enabled by default — this file is documentation you copy from.

schema_version: 1
name: acme-slack-overrides

tools:
  # ---------------------------------------------------------------------- 1.
  # A CHANNEL-ID ACL. korotovsky's reads address channels by opaque ID
  # (C0EXEC0001), not name, so a denylist has to list the real IDs of the
  # channels an agent must never read — #exec, #hr, #legal, and so on. This
  # constrains conversations_history; repeat it for conversations_replies.
  #
  # `must_not_match` on channel_id denies a call whose channel_id matches a
  # restricted ID; the shipped `redact` action still applies to everything else.
  conversations_history:
    constraints:
      - arg: channel_id
        must_not_match: '^(C0EXEC0001|C0HR000042|C0LEGAL0007)$'
        reason: restricted channel (by ID) — #exec, #hr-benefits, #legal
  conversations_replies:
    constraints:
      - arg: channel_id
        must_not_match: '^(C0EXEC0001|C0HR000042|C0LEGAL0007)$'
        reason: restricted channel (by ID) — #exec, #hr-benefits, #legal

  # ---------------------------------------------------------------------- 2.
  # TIGHTEN THE SEARCH BYPASS. conversations_search_messages takes a query, not
  # a channel_id, so a per-channel ACL cannot constrain it: it reads across
  # every conversation the token can see. The pack ships strict `redact` because
  # blocking search outright makes most Slack agents useless. If your workspace
  # keeps genuinely sensitive material in private channels, escalate it.
  conversations_search_messages:
    action: require_approval
    then: redact
    reason: >-
      workspace-wide search reaches restricted channels no per-channel ACL can
      see; a human authorizes each sweep, and results are still redacted

  # ---------------------------------------------------------------------- 3.
  # A CHANNEL ALLOWLIST instead of a denylist, if your posture is that agents
  # read only where they are explicitly invited. `must_match` is a positive
  # requirement, so a call that omits the argument is denied too — fail-closed by
  # construction.
  #
  # conversations_replies:
  #   constraints:
  #     - arg: channel_id
  #       must_match: '^(C0SUPPORT01|C0ENG000001)$'
  #       reason: agents may only read the support and engineering channels

# ------------------------------------------------------------------------ 4.
# RELAX THE TAINT MODEL — the pack's sharpest usability tradeoff, and the one
# thing on this page an override layer CANNOT do for you.
#
# The shipped policy makes every content read a taint source and the send path a
# sink, so a session may read OR send, not both. That deliberately breaks
# "summarize this thread and post the summary", the single most common Slack
# agent workflow.
#
# ⚠️  FRAMEWORK LIMITATION: taint_sources and taint_sinks merge as a UNION across
# layers and sequence_rules are concatenated (policy/merge.py). Merging is
# therefore ADDITIVE ONLY — a later layer can add a taint source but never remove
# one, and there is no top-level `replace`. Layer order does not help either:
# `wrap` always applies the connector's layers first.
#
# So the "customize with an override, never a fork" promise does not hold for the
# taint model specifically. To narrow it today you must copy policy.yaml and run
# it with --policy instead of --connector:
#
#   cp connectors/slack/policy.yaml my-slack-policy.yaml   # then edit taint_sources
#   mcp-gateway wrap --policy my-slack-policy.yaml \
#                    --policy connectors/slack/roles.yaml -- <server cmd>
#
# That is a real gap in the framework rather than a property of this pack, and it
# is worth fixing upstream (a `replace: true` at layer level, or explicit
# taint_sources_remove) before more packs inherit the workaround.
#
# If you do narrow it, understand what you give up: an injected instruction
# sitting in an ordinary channel can then steer the session to post, with human
# approval on conversations_add_message as the remaining control. Only accept
# that trade if your approvers actually read what they approve.
