# Role overlays for the Slack pack — layered AFTER policy.yaml.
#
# Field-level merge: an overlay changes only the fields it names, so a role
# that relaxes an action still inherits the base rule's reason.
#
#   support-agent   — sends messages/reactions and manages read state as normal
#                     work; user-group administration stays gated
#   workspace-admin — every write un-gated (they run the workspace)
#   bot             — unattended: no human can answer an approval prompt, so every
#                     write is BLOCKED outright rather than left to fail closed
#
# NOTE: taint/sequence still apply on top of these grants — even for a role
# whose send is un-gated, a session that has read untrusted content is blocked
# from conversations_add_message by the sequence gate.
schema_version: 1
name: slack-roles

tools:
  conversations_add_message:
    roles:
      support-agent:
        action: allow
        reason: "messaging and read-state are the support agent's normal work"
      workspace-admin:
        action: allow
        reason: "workspace admin performs Slack writes directly"
      bot:
        action: block
        reason: "unattended bot identity may not change Slack state"
  reactions_add:
    roles:
      support-agent:
