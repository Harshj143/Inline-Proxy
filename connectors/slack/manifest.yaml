# Connector manifest — what this pack protects and how to launch it.
# See docs/CONTRIBUTING.md for the authoring guide.
name: slack
description: "Security pack for the Slack MCP server (22 tools, default-deny)"
upstream:
  server: slack-mcp-server
  repository: https://github.com/korotovsky/slack-mcp-server
  # The most powerful open-source Slack MCP server. Source-extractable, so this
  # pack can police the ENTIRE, VERIFIED tool surface — see README.md
  # § "Why this server, not Slack's first-party endpoint". Distributed as a Go
  # binary and a container image.
  package: ghcr.io/korotovsky/slack-mcp-server
  # The inventory in tools.yaml was extracted from this source revision.
  tested_versions: ["master@b88c0de (2026-05-15)"]
  # The upstream authenticates to Slack (bot xoxb, or browser xoxc/xoxd session
  # tokens); the gateway never sees the token beyond passing the environment
  # through to the subprocess it launches. Four write/read tools are additionally
  # gated OFF by default upstream (see tools.yaml).
  credentials_env:
    - SLACK_MCP_XOXP_TOKEN
    - SLACK_MCP_XOXC_TOKEN
    - SLACK_MCP_XOXD_TOKEN
# Template command the gateway launches in sidecar mode. Requires a Slack token
# in the environment; enable the write tools deliberately with the upstream's
# own env flags (SLACK_MCP_ADD_MESSAGE_TOOL, SLACK_MCP_REACTION_TOOL,
# SLACK_MCP_ATTACHMENT_TOOL) — this pack still gates them behind approval:
#   mcp-gateway wrap --connector slack -- \
#     docker run -i --rm -e SLACK_MCP_XOXP_TOKEN \
#       ghcr.io/korotovsky/slack-mcp-server mcp-server --transport stdio
launch:
  - docker
  - run
  - -i
  - --rm
  - -e
  - SLACK_MCP_XOXP_TOKEN
  - ghcr.io/korotovsky/slack-mcp-server
  - mcp-server
  - --transport
  - stdio
