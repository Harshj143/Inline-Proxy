# yaml-language-server: $schema=../../policies/policy.schema.json
#
# Default security policy for the GitHub MCP server (github-mcp-server v1.7.0).
# DEFAULT-DENY over the full 109-tool surface. See README.md for the threat model.
#   reads            -> redact (GitHub content can carry PII/secrets/injected text)
#   security findings -> redact:strict; raw-secret reads (logs, secret scanning) -> quarantine
#   writes           -> require_approval (a human signs off)
#   destructive      -> block
# Untrusted content reads taint the session; exfil-capable writes are blocked once tainted.
schema_version: 1
name: github
default_action: block

taint_sources: [get_discussion, get_discussion_comments, get_file_contents, get_gist, get_notification_details, issue_read, list_discussions, list_gists, list_issues, list_pull_requests, pull_request_read, search_code, search_issues, search_pull_requests]
taint_sinks: [create_gist, create_or_update_file, push_files, update_gist]

sequence_rules:
  - after: get_job_logs
    forbid: create_gist
    reason: no gist right after reading CI logs (secret exfiltration guard)
  - after: list_secret_scanning_alerts
    forbid: create_gist
    reason: no gist right after reading secret-scanning alerts (exfiltration guard)

tools:
  # ---- Actions / CI ----
  actions_get:
    action: redact
    redaction: standard
    reason: "GitHub content may carry PII/secrets/injected text; scrub on read"
  actions_list:
    action: redact
    redaction: standard
    reason: "GitHub content may carry PII/secrets/injected text; scrub on read"
  actions_run_trigger:
    action: require_approval
    then: allow
    reason: "state-changing GitHub write; a human signs off"
  get_job_logs:
    action: quarantine
    reason: "may expose raw secret values; withheld from the model for review"
  # ---- Code quality ----
  get_code_quality_finding:
    action: redact
    redaction: strict
    reason: "security finding; strip any secret/PII before the model sees it"
  # ---- Code scanning ----
