# Role overlays for the GitHub pack — layered AFTER policy.yaml.
#
# Field-level merge: an overlay changes only the fields it names, so a role
# that relaxes an action still inherits the base rule's redaction/reason.
# Least privilege is the default; these are deliberate, narrow grants.
#
#   developer       — the default; unchanged from policy.yaml (writes need approval)
#   reviewer        — may comment/review without approval (high-volume, low-blast-radius),
#                     but code-changing and merge operations still need one
#   release-manager — may merge, branch, push, and trigger CI without approval
#   bot             — non-interactive: no human can answer an approval prompt, so
#                     every write is BLOCKED outright rather than left to fail closed
schema_version: 1
name: github-roles

tools:
  actions_run_trigger:
    roles:
      release-manager:
        action: allow
        reason: "release managers own the merge/deploy path"
      bot:
        action: block
        reason: "unattended bot identity may not change GitHub state"
